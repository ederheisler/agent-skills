name: Release

# Every push to main runs the release script. The script releases only when
# skills/ has a net change since the latest vX.Y.Z tag (see release.sh for the
# version rules), so pushes that only touch root docs, CI, VERSION or
# CHANGELOG.md release nothing. They still run so that a missing GitHub Release
# for the latest tag gets published. Releases run one at a time and are never
# cancelled half way.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh
